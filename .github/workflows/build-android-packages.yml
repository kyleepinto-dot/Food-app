name: Build Android Packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aab, apk]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Flet CLI
        run: python -m pip install "flet[cli]==0.85.3"

      - name: Verify Flet CLI
        run: flet --version

      - name: Build ${{ matrix.target }}
        run: >-
          flet build ${{ matrix.target }}
          --yes
          --verbose
          --build-number ${{ github.run_number }}

      - name: Upload ${{ matrix.target }} archive
        uses: actions/upload-artifact@v7
        with:
          name: foodapp-android-${{ matrix.target }}-${{ github.run_number }}
          path: build/${{ matrix.target }}/
          if-no-files-found: error
