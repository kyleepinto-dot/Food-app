name: Build Android Packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [aab, apk]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.target }}
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}

      - name: Upload ${{ matrix.target }} archive
        uses: actions/upload-artifact@v7
        with:
          name: foodapp-android-${{ matrix.target }}-${{ github.run_number }}
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error